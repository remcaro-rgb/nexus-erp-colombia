# every value still needs the EG-7 sign-off, so production rules refuse them.
# Annual values end 2026-12-31: 2027 has NO rows and fails closed (R-TX-02, R-LB-03).
# Percent values are written in percent units ("19" = 19 %), as strings (no floats).
# UNKNOWN rows record that a value exists in law but was not transcribed from an opened
# source: they fail closed until a tenant loads the official value (two-person approval).
