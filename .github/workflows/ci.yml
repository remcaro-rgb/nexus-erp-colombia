# Nexus ERP CI (P03 deliverable 3). Owner: P03. DEV-only project: no deploy job, no secrets needed.
# Required checks for the merge queue: ci, policy, devops-tests, compose-up. Actions pinned by commit SHA.
# Jobs adapt to the wave: steps whose sources do not exist yet (frontend, Makefile targets) say so and pass.
# Single source of truth (FIX-D-W01-1): every check step of the four jobs runs
# `bash scripts/ci/ci-parity.sh <job> --step <name>`; `bash scripts/ci/ci-parity.sh` runs the same locally.
name: ci

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ERP_ENVIRONMENT: dev
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  UV_PYTHON: "3.13"

jobs:
  ci:
    name: make ci (lint, unit, contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          # throwaway container that lives only for this job, reachable on the runner loopback only
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: docker.io/valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports: ["127.0.0.1:6379:6379"]
    env:
      # TCP to the service container (no unix socket on the runner). make db-setup creates the safe role
      # nexus_ci (LOGIN CREATEDB, NOSUPERUSER, NOBYPASSRLS) through the admin URL; tests run as nexus_ci.
      DATABASE_URL: postgres://nexus_ci@127.0.0.1:5432/nexus_erp
      ERP_DB_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: hashFiles('pnpm-lock.yaml') != ''
        with: {node-version: "22", cache: pnpm}
      - name: Install Python deps (uv.lock, frozen)
        if: hashFiles('uv.lock') != ''
        run: uv sync --frozen
      - name: Install JS deps (pnpm-lock.yaml, frozen)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Ephemeral field-encryption key (masked, never committed)
        run: |
          K=$(python3 -c 'import base64,secrets;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$K"
          echo "ERP_FIELD_ENCRYPTION_KEY=$K" >> "$GITHUB_ENV"
      - name: make ci
        run: bash scripts/ci/ci-parity.sh make-ci --step make-ci
      - name: makemigrations --check
        if: hashFiles('backend/manage.py') != ''
        run: bash scripts/ci/ci-parity.sh make-ci --step makemigrations
      - name: Type check (mypy / tsc)
        run: bash scripts/ci/ci-parity.sh make-ci --step typecheck
      - name: Frontend build + vitest
        if: hashFiles('frontend/package.json') != ''
        run: bash scripts/ci/ci-parity.sh make-ci --step frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: junit-ci, path: reports/, if-no-files-found: ignore}

  policy:
    name: policy (forbidden patterns, ADR-004, compose, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Forbidden patterns (C2-8)
        run: bash scripts/ci/ci-parity.sh policy --step forbidden-patterns
      - name: ADR-004 static checks (secured views, raw SQL, HTTP clients)
        run: bash scripts/ci/ci-parity.sh policy --step static-checks
      - name: Compose policy lint (D-P03)
        run: bash scripts/ci/ci-parity.sh policy --step compose-lint
      - name: Shell lint (shellcheck)
        run: bash scripts/ci/ci-parity.sh policy --step shellcheck
      - name: OTel scrub config in sync with pii-patterns.json
        run: bash scripts/ci/ci-parity.sh policy --step otel-scrub
      - name: Secret scan (repo files)
        run: bash scripts/ci/ci-parity.sh policy --step secret-scan
      - name: Secret scan (gitleaks, full history)
        run: bash scripts/ci/ci-parity.sh policy --step gitleaks
      - name: SAST (semgrep, Django + Python rules)
        if: hashFiles('backend/**/*.py') != ''
        run: bash scripts/ci/ci-parity.sh policy --step semgrep
      - name: Dependency audit (pip-audit / pnpm audit)
        if: hashFiles('uv.lock') != ''
        run: bash scripts/ci/ci-parity.sh policy --step dependency-audit
      - name: License check (no AGPL/GPL in the application dependencies)
        if: hashFiles('uv.lock') != ''
        run: bash scripts/ci/ci-parity.sh policy --step licenses

  devops-tests:
    name: P03 tests (T-P03-01..06)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python deps incl. the dev group (uv.lock, frozen) — pytest-django, hypothesis
        run: uv sync --frozen
      - name: P03 tests (pytest with the kernel plugin, locked dev environment)
        run: bash scripts/ci/ci-parity.sh p03-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: junit-p03, path: reports/junit/, if-no-files-found: ignore}

  compose-up:
    name: T-P03-01 docker compose up healthy from a clean clone
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: dev-up (builds images when sources exist, generates fresh dev secrets, migrates, waits healthy)
        run: bash scripts/ci/ci-parity.sh compose-startup --step dev-up
      - name: dev-seed
        run: bash scripts/ci/ci-parity.sh compose-startup --step dev-seed
      - name: dev-health
        run: bash scripts/ci/ci-parity.sh compose-startup --step dev-health
      - name: DR drill (T-P03-03) against the running stack
        run: bash scripts/ci/ci-parity.sh compose-startup --step dr-drill
      - name: Image SBOM (syft, CycloneDX) + vulnerability scan (grype, fail on critical)
        run: bash scripts/ci/ci-parity.sh compose-startup --step image-scan
      - name: Logs on failure (no secrets are logged by the services)
        if: failure()
        run: bash scripts/ci/ci-parity.sh compose-startup --step logs
      - name: dev-down (keeps volumes)
        if: always()
        run: bash scripts/ci/ci-parity.sh compose-startup --step dev-down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: compose-up, path: "reports/\nreports-health.json", if-no-files-found: ignore}
