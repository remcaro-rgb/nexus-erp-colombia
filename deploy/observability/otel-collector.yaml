          - 'replace_pattern(log.attributes["url.query"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["url.query"])'
          - 'replace_pattern(log.attributes["db.statement"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["db.statement"])'
          - 'replace_pattern(log.attributes["db.query.text"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["db.query.text"])'
          - 'replace_pattern(log.attributes["user.email"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["user.email"])'
          - 'replace_pattern(log.attributes["enduser.id"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["enduser.id"])'
          - 'replace_pattern(log.attributes["code.function.args"], "\\b\\d{6,10}\\b", "[DOC_ID]") where IsString(log.attributes["code.function.args"])'
          # END generated pii statements
