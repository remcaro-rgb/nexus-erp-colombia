# Test overlay (ADR-014): ephemeral stack for CI / per-PR test environments. Owner: P03.
# Database, cache and object storage live on tmpfs: nothing survives `down`. Used by .github/workflows/ci.yml.
services:
  db:
    volumes: !override
      - ./deploy/dev/db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql:size=1g
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  valkey:
    volumes: !reset []
    tmpfs: [/data]
  minio:
    volumes: !reset []
    tmpfs: [/data]
  mailpit:
    volumes: !reset []
    tmpfs: [/data]
  keycloak:
    volumes: !override
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
