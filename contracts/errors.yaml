# Stable error code registry (contracts-v1.0.0). Codes are part of the public contract: never renamed or reused (contracts/VERSIONING.md).
# Problem responses (RFC 9457) carry `code`; warnings use severity `warning` and never block unless stated.
# Columns: code, http status, module, severity, title_es (UI message key default), title_en.
# Registry codes (docs/spec/features/feature-registry.json) win over the original prompt names:
#   `stock_insufficient` is THE stock code (the P02 prompt example `insufficient_stock` is not registered, to avoid two codes for one rule).
version: 1.0.0
codes:
