openapi: 3.1.0
info:
  title: Nexus ERP Colombia API (DEV-only contract)
  version: 1.0.0
  summary: Frozen public API contract (G0). Every business process is reachable through this API (UR-22, C1-7).
  description: 'Contract freeze P02, contracts-v1.0.0. DEV-only: synthetic data, simulators for DIAN, PILA, banks, payments and e-mail.

    No production server is described. Conventions (enforced by tests/contract and contracts/.spectral.yaml):

    * resources `/api/v1/<module>/<resource>`; actions as sub-resources `POST …/{id}:<verb>`; portal API under `/api/portal/v1/`;

    * every state change is an explicit action with a required `Idempotency-Key`; updates require `If-Match`; no state change via PATCH of `status`;

    * long-running operations answer `202` + `Location: /api/v1/operations/{id}`;

    * bulk `POST …:bulk` (≤ 1,000 items, per-item results, `all_or_nothing`); `POST …:simulate` returns the would-be documents, journal entries and stock moves without persisting;

    * money, quantities, rates and percentages are decimal strings, never JSON numbers (D-001);

    * errors are RFC 9457 `application/problem+json` with a stable `code` from contracts/errors.yaml;

    * every operation declares `x-permission` (`<module>.<resource>.<action>`), every schema property declares `x-classification`.

    '
  license:
    name: Proprietary (DEV contract)
    identifier: LicenseRef-Nexus-DEV
  x-generated: GENERATED by contracts/tools/build_contracts.py from contracts/src — do not edit by hand; edit the source and regenerate.
servers:
- url: http://127.0.0.1:8080
  description: Local DEV stack (loopback only; port may fall back to 8081–8090, D-002)
- url: http://127.0.0.1:4010
  description: Contract mock server (Prism, contracts/mock/compose.yaml)
security:
- oauth2: []
- tokenExchange: []
tags:
- name: Operaciones
  description: Long-running operations (202 + polling)
paths:
  /api/v1/operations/{id}:
    get:
      operationId: kernel_operations_get
      x-owner: P01
      summary: Estado de una operación de larga duración
      tags:
      - Operaciones
      x-permission: kernel.operation.read
      x-error-codes:
      - not_found
      - policy_denied
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200':
          description: Operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/operations/{id}:cancel:
    post:
      operationId: kernel_operations_cancel
      x-owner: P01
      summary: Cancelar una operación en curso (si es cancelable)
      tags:
      - Operaciones
      x-permission: kernel.operation.void
      x-error-codes:
      - not_found
      - policy_denied
      - operation_not_cancellable
      - idempotency_conflict
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/CompanyHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Operation after cancellation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'Keycloak (P04). Authorization code + PKCE for users and portal users (D-033); client credentials for service accounts;

        RFC 8693 token exchange for delegated agents (AI agent, MCP) — a delegated token never exceeds the delegating user''s permissions.

        '
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:8080/auth/realms/nexus/protocol/openid-connect/auth
          tokenUrl: http://127.0.0.1:8080/auth/realms/nexus/protocol/openid-connect/token
          refreshUrl: http://127.0.0.1:8080/auth/realms/nexus/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
            erp.api: Public ERP API (permission codes are evaluated by iam.policy, not by scopes)
            portal: Portal API (external identities only)
        clientCredentials:
          tokenUrl: http://127.0.0.1:8080/auth/realms/nexus/protocol/openid-connect/token
          scopes:
            erp.api: Public ERP API for service accounts
    tokenExchange:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Delegated access token obtained by RFC 8693 token exchange

        (`grant_type=urn:ietf:params:oauth:grant-type:token-exchange`, `actor_token` = agent identity, `subject_token` = user token).

        The resulting token carries `act` (actor) and is accepted on the same endpoints; iam.policy intersects agent and user permissions.

        '
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource id (UUIDv7)
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended). Same key + same body replays the original response; same key + different body → 409 `idempotency_conflict`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (resource version) from the last read. Mismatch → 412 `version_conflict`; missing → 428 `precondition_required`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional ETag guard for actions on versioned resources.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CompanyHeader:
      name: X-Company-Id
      in: header
      required: false
      description: Active company (legal entity) inside the tenant. Defaults to the principal's default company; must be one of the principal's companies.
      schema:
        type: string
        format: uuid
    Fields:
      name: fields
      in: query
      required: false
      description: Sparse fieldset, comma-separated property names. Fields hidden by the field policy are never returned even if requested.
      schema:
        type: string
        maxLength: 2000
    Filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: 'Filter grammar `filter[field][op]=value` (also accepted as `field[op]=value`). Operators: eq, ne, lt, lte, gt, gte, in (comma list),

        contains, between (two comma-separated values), isnull (true|false). Unknown fields or operators → 400 `filter_invalid`.

        '
      schema:
        type: object
        additionalProperties:
          type: object
          propertyNames:
            enum:
            - eq
            - ne
            - lt
            - lte
            - gt
            - gte
            - in
            - contains
            - between
            - isnull
          additionalProperties:
            type: string
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields; prefix `-` for descending (e.g. `-document_date,number`).
      schema:
        type: string
        maxLength: 500
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`.
      schema:
        type: string
        maxLength: 1000
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Query:
      name: q
      in: query
      required: false
      description: Free-text search (policy-scoped).
      schema:
        type: string
        maxLength: 200
    Format:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
        - json
        - csv
        - xlsx
        - pdf
        default: json
  headers:
    ETag:
      description: Resource version tag; send it back in If-Match.
      schema:
        type: string
    Location:
      description: URL of the created resource or of the operation (`/api/v1/operations/{id}`).
      schema:
        type: string
    Deprecation:
      description: RFC 9745 deprecation date of the operation (see contracts/VERSIONING.md).
      schema:
        type: string
    Sunset:
      description: RFC 8594 sunset date.
      schema:
        type: string
    IdempotentReplayed:
      description: '`true` when the response is a replay for a previously seen Idempotency-Key.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
  responses:
    BadRequest:
      description: Malformed request, invalid filter/sort/fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials (`unauthenticated`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Denied by iam.policy (`policy_denied`, `sod_violation`, scope violations)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible to the principal (row policy never reveals existence)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency or state conflict (`idempotency_conflict`, `invalid_state_transition`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current version (`version_conflict`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match header missing (`precondition_required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation or business rule failure (stable `code`, per-field `errors`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit or AI/MCP budget exceeded (`rate_limited`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decimal:
      type: string
      description: Decimal number as a string (never a JSON number). Dot as decimal separator in the API; es-CO formatting is a UI concern.
      pattern: ^-?\d{1,20}(\.\d{1,10})?$
      examples:
      - '1234567.89'
    CurrencyCode:
      type: string
      description: ISO 4217 code; COP is the functional currency (D-001)
      pattern: ^[A-Z]{3}$
      examples:
      - COP
    Money:
      type: object
      required:
      - amount
      - currency
      additionalProperties: false
      properties:
        amount:
          description: NUMERIC(20,4) as string
          type: string
          pattern: ^-?\d{1,16}(\.\d{1,4})?$
          examples:
          - '1190000.0000'
          x-classification: internal
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          x-classification: public
    Quantity:
      type: object
      required:
      - value
      - uom
      additionalProperties: false
      properties:
        value:
          description: NUMERIC(20,6) as string
          type: string
          pattern: ^-?\d{1,14}(\.\d{1,6})?$
          examples:
          - '12.000000'
          x-classification: internal
        uom:
          description: Unit of measure code
          type: string
          maxLength: 20
          x-classification: public
    Rate:
      type: object
      description: Exchange rate NUMERIC(24,10)
      required:
      - value
      - from_currency
      - to_currency
      additionalProperties: false
      properties:
        value:
          type: string
          pattern: ^\d{1,14}(\.\d{1,10})?$
          examples:
          - '4000.0000000000'
          x-classification: internal
        from_currency:
          $ref: '#/components/schemas/CurrencyCode'
          x-classification: public
        to_currency:
          $ref: '#/components/schemas/CurrencyCode'
          x-classification: public
        rate_date:
          type: string
          format: date
          x-classification: internal
    Percent:
      type: string
      description: Percentage NUMERIC(9,6) as string (19 means 19 %)
      pattern: ^-?\d{1,3}(\.\d{1,6})?$
      examples:
      - '19'
    UnitCost:
      type: string
      description: Unit cost NUMERIC(24,8) as string
      pattern: ^-?\d{1,16}(\.\d{1,8})?$
      examples:
      - '1000.00000000'
    DateRange:
      type: object
      required:
      - from
      additionalProperties: false
      properties:
        from:
          type: string
          format: date
          x-classification: internal
        to:
          type:
          - string
          - 'null'
          format: date
          x-classification: internal
    Nit:
      type: object
      description: Colombian tax id (NIT/CC/CE…) with verification digit; the check digit algorithm is validated by P06 (`/api/v1/tax/localization/nit:validate`).
      required:
      - document_type
      - number
      additionalProperties: false
      properties:
        document_type:
          type: string
          maxLength: 10
          description: DIAN identification type code (EXTERNAL code list, read from tax.parameters)
          x-classification: internal
        number:
          type: string
          pattern: ^[0-9A-Za-z-]{3,20}$
          examples:
          - '900000001'
          x-classification: confidential
        check_digit:
          type:
          - string
          - 'null'
          pattern: ^[0-9]$
          examples:
          - '0'
          x-classification: confidential
    PartyRef:
      type: object
      required:
      - id
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: internal
        kind:
          type: string
          enum:
          - customer
          - vendor
          - employee
          - other
          x-classification: internal
        name:
          type: string
          maxLength: 250
          readOnly: true
          x-classification: confidential
        tax_id:
          type: string
          maxLength: 25
          readOnly: true
          x-classification: confidential
    DocumentRef:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 80
          description: <module>.<document>
          x-classification: internal
        id:
          type: string
          format: uuid
          x-classification: internal
        number:
          type:
          - string
          - 'null'
          maxLength: 60
          x-classification: internal
    AuditStamp:
      type: object
      readOnly: true
      additionalProperties: false
      properties:
        created_at:
          type: string
          format: date-time
          x-classification: internal
        created_by:
          type: string
          format: uuid
          x-classification: internal
        updated_at:
          type: string
          format: date-time
          x-classification: internal
        updated_by:
          type: string
          format: uuid
          x-classification: internal
        channel:
          type: string
          enum:
          - ui
          - api
          - ai
          - mcp
          - import
          - scheduler
          - portal
          - system
          x-classification: internal
        on_behalf_of:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
    DimensionSlots:
      type: object
      description: Analytical dimension slots carried by every journal-producing line (F-ACC-DIM). Only ACTIVE DETALLE nodes of the same company valid on the document date are accepted.
      additionalProperties: false
      properties:
        cost_center_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        business_unit_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        aux_abierto_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        item_dimension_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        branch_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
    Page:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items: {}
          x-classification: internal
        next_cursor:
          type:
          - string
          - 'null'
          x-classification: internal
    Problem:
      type: object
      description: RFC 9457 problem details with a stable error code.
      required:
      - type
      - title
      - status
      - code
      - trace_id
      properties:
        type:
          type: string
          format: uri-reference
          x-classification: public
        title:
          type: string
          x-classification: public
        status:
          type: integer
          minimum: 400
          maximum: 599
          x-classification: public
        detail:
          type: string
          x-classification: internal
        instance:
          type: string
          x-classification: internal
        code:
          $ref: '#/components/schemas/ErrorCode'
          x-classification: public
        trace_id:
          type: string
          x-classification: internal
        severity:
          type: string
          enum:
          - error
          - warning
          x-classification: public
        errors:
          type: array
          description: Per-field or per-row errors
          x-classification: internal
          items:
            type: object
            properties:
              pointer:
                type: string
                description: JSON pointer or row/column reference
                x-classification: internal
              code:
                $ref: '#/components/schemas/ErrorCode'
                x-classification: public
              detail:
                type: string
                x-classification: internal
        warnings:
          type: array
          x-classification: internal
          items:
            $ref: '#/components/schemas/Warning'
    Warning:
      type: object
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          x-classification: public
        detail:
          type: string
          x-classification: internal
    Operation:
      type: object
      required:
      - id
      - status
      - kind
      properties:
        id:
          type: string
          format: uuid
          x-classification: internal
        kind:
          type: string
          maxLength: 120
          description: operationId that started it
          x-classification: internal
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          x-classification: internal
        progress:
          type: string
          description: Decimal 0–100 as string
          pattern: ^\d{1,3}(\.\d{1,2})?$
          examples:
          - '100'
          x-classification: internal
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          x-classification: internal
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          x-classification: internal
        result_links:
          type: array
          x-classification: internal
          items:
            type: object
            properties:
              rel:
                type: string
                x-classification: internal
              href:
                type: string
                x-classification: internal
        error:
          oneOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
          x-classification: internal
    ActionRequest:
      type: object
      description: Body of an action endpoint. `reason` is mandatory for reject/reverse/void/reopen/override actions (validated server-side, `reason_required`).
      additionalProperties: false
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 2000
          x-classification: internal
        comment:
          type:
          - string
          - 'null'
          maxLength: 2000
          x-classification: internal
        effective_date:
          type:
          - string
          - 'null'
          format: date
          x-classification: internal
        parameters:
          type: object
          additionalProperties: true
          description: Action-specific options (e.g. dry_run
          mode simulate|apply): null
          x-classification: internal
    ActionResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          maxLength: 40
          x-classification: internal
        resource:
          $ref: '#/components/schemas/DocumentRef'
          x-classification: internal
        data:
          type: object
          additionalProperties: true
          x-classification: internal
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          x-classification: internal
    SimulationResult:
      type: object
      description: Would-be effects of an action, never persisted (C1-3). Same validation errors as the real action.
      required:
      - persisted
      - documents
      - journal_entries
      - stock_moves
      properties:
        persisted:
          const: false
          x-classification: internal
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
          x-classification: internal
        journal_entries:
          type: array
          x-classification: internal
          items:
            type: object
            properties:
              journal:
                type: string
                x-classification: internal
              posting_date:
                type: string
                format: date
                x-classification: internal
              lines:
                type: array
                x-classification: internal
                items:
                  type: object
                  properties:
                    account:
                      type: string
                      x-classification: internal
                    debit:
                      $ref: '#/components/schemas/Money'
                      x-classification: internal
                    credit:
                      $ref: '#/components/schemas/Money'
                      x-classification: internal
                    dimensions:
                      $ref: '#/components/schemas/DimensionSlots'
                      x-classification: internal
        stock_moves:
          type: array
          items:
            type: object
            additionalProperties: true
          x-classification: internal
        explain:
          type: array
          items:
            type: string
          x-classification: internal
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
          x-classification: internal
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          x-classification: internal
    BulkRequest:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        all_or_nothing:
          type: boolean
          default: true
          x-classification: internal
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: true
          x-classification: internal
    BulkResult:
      type: object
      required:
      - results
      properties:
        all_or_nothing:
          type: boolean
          x-classification: internal
        committed:
          type: boolean
          x-classification: internal
        results:
          type: array
          maxItems: 1000
          x-classification: internal
          items:
            type: object
            required:
            - index
            - status
            properties:
              index:
                type: integer
                minimum: 0
                x-classification: internal
              status:
                type: string
                enum:
                - created
                - updated
                - failed
                - skipped
                x-classification: internal
              id:
                type:
                - string
                - 'null'
                format: uuid
                x-classification: internal
              error:
                oneOf:
                - $ref: '#/components/schemas/Problem'
                - type: 'null'
                x-classification: internal
    ReportResult:
      type: object
      required:
      - columns
      - rows
      properties:
        report:
          type: string
          x-classification: internal
        parameters:
          type: object
          additionalProperties: true
          x-classification: internal
        columns:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                x-classification: internal
              label:
                type: string
                x-classification: internal
              type:
                type: string
                x-classification: internal
          x-classification: internal
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          x-classification: internal
        totals:
          type: object
          additionalProperties: true
          x-classification: internal
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          x-classification: internal
        synthetic:
          type: boolean
          description: true when computed from synthetic data or fixture parameters (NOT LEGALLY VERIFIED)
          x-classification: public
    TreeNode:
      type: object
      required:
      - id
      - children
      examples:
      - id: 0190f000-0000-7000-8000-000000000010
        code: CC-01
        label: Administración (SINTÉTICO)
        node_type: AGRUPADOR
        path: CC-01
        children:
        - id: 0190f000-0000-7000-8000-000000000011
          code: CC-01-01
          label: Contabilidad
          node_type: DETALLE
          path: CC-01/CC-01-01
          children: []
      properties:
        id:
          type: string
          format: uuid
          x-classification: internal
        code:
          type: string
          x-classification: internal
        label:
          type: string
