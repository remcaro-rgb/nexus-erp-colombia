components:
  schemas:
    ApprovalPolicy:
      type: object
      description: Workflow approval-policies
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        company_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        active:
          type: boolean
          x-classification: internal
        resource_type:
          type: string
          maxLength: 255
          x-classification: internal
        condition:
          type: object
          additionalProperties: true
          x-classification: internal
        steps:
          type: object
          additionalProperties: true
          x-classification: internal
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
          x-classification: internal
          readOnly: true
      required:
      - id
      - name
      - resource_type
      - steps
    ApprovalPolicyInput:
      type: object
      description: Create/replace body of ApprovalPolicy
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        active:
          type: boolean
          x-classification: internal
        resource_type:
          type: string
          maxLength: 255
          x-classification: internal
        condition:
          type: object
          additionalProperties: true
          x-classification: internal
        steps:
          type: object
          additionalProperties: true
          x-classification: internal
      required:
      - name
      - resource_type
      - steps
    ApprovalPolicyPatch:
      type: object
      description: Partial update body of ApprovalPolicy (state never changes through PATCH; use action endpoints)
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        active:
          type: boolean
          x-classification: internal
        resource_type:
          type: string
          maxLength: 255
          x-classification: internal
        condition:
          type: object
          additionalProperties: true
          x-classification: internal
