components:
  schemas:
    Employee:
      type: object
      description: Hr employees
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        company_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 40
          x-classification: internal
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          x-classification: internal
          readOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: restricted-pii
        document:
          $ref: ../root.yaml#/components/schemas/Nit
          x-classification: restricted-pii
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
          x-classification: restricted-pii
        phone:
          type:
          - string
          - 'null'
          pattern: ^[0-9+() -]{5,25}$
          examples:
          - +57 601 0000000
          x-classification: restricted-pii
        address:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: restricted-pii
        birth_date:
          type:
          - string
          - 'null'
          format: date
          x-classification: restricted-pii
        health_entity:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: sensitive-pii
        pension_entity:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: sensitive-pii
        bank_account:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: confidential
        position_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        org_unit_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
          x-classification: internal
          readOnly: true
      required:
      - id
      - code
      - full_name
      - document
