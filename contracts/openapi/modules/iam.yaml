components:
  schemas:
    Company:
      type: object
      description: Iam companies
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 40
          x-classification: internal
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          x-classification: internal
          readOnly: true
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        trade_name:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: internal
        nit:
          $ref: ../root.yaml#/components/schemas/Nit
          x-classification: internal
        timezone:
          type: string
          maxLength: 255
          x-classification: internal
        functional_currency:
          $ref: ../root.yaml#/components/schemas/CurrencyCode
          x-classification: public
        gs1_prefix:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: internal
        default_book_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
          x-classification: internal
          readOnly: true
      required:
      - id
      - code
      - legal_name
      - nit
