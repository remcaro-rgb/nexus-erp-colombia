components:
  schemas:
    OnboardingSession:
      type: object
      description: Onboarding sessions
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        company_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        status:
          type: string
          maxLength: 255
          x-classification: internal
          readOnly: true
        current_step:
          type: string
          maxLength: 255
          x-classification: internal
          readOnly: true
        answers:
          type: object
          additionalProperties: true
          x-classification: confidential
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
          x-classification: internal
          readOnly: true
      required:
      - id
    OnboardingSessionInput:
      type: object
      description: Create/replace body of OnboardingSession
      additionalProperties: false
      properties:
        answers:
          type: object
          additionalProperties: true
          x-classification: confidential
    OnboardingSessionPatch:
      type: object
      description: Partial update body of OnboardingSession (state never changes through PATCH; use action endpoints)
      additionalProperties: false
      properties:
        answers:
          type: object
          additionalProperties: true
          x-classification: confidential
      minProperties: 1
    OnboardingSessionPage:
      allOf:
      - $ref: ../root.yaml#/components/schemas/Page
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/OnboardingSession'
            x-classification: internal
    OnboardingTemplate:
      type: object
