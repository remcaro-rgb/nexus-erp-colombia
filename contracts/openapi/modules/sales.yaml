          format: uuid
          x-classification: internal
        salesperson_id:
          type:
          - string
          - 'null'
          format: uuid
          x-classification: internal
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
