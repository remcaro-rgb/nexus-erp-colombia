components:
  schemas:
    Party:
      type: object
      description: Sales parties
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        company_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 40
          x-classification: internal
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          x-classification: internal
          readOnly: true
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: confidential
        trade_name:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: confidential
        nit:
          $ref: ../root.yaml#/components/schemas/Nit
          x-classification: confidential
        person_type:
          type: string
          enum:
          - NATURAL
          - JURIDICA
          x-classification: internal
        roles:
          type: array
          items:
            type: string
            enum:
            - customer
            - vendor
            - employee
            - other
          x-classification: internal
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
          x-classification: restricted-pii
        phone:
          type:
          - string
          - 'null'
          pattern: ^[0-9+() -]{5,25}$
          x-classification: restricted-pii
        address:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: restricted-pii
        municipality_code:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: internal
        credit_limit:
          $ref: ../root.yaml#/components/schemas/Money
