components:
  schemas:
    SavedReport:
      type: object
      description: Reporting reports
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          x-classification: public
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        company_id:
          type: string
          format: uuid
          x-classification: internal
          readOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 40
          x-classification: internal
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          x-classification: internal
          readOnly: true
        definition:
          type: object
          additionalProperties: true
          x-classification: internal
        schedule:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: internal
        recipients:
          type: array
          items:
            type: string
            format: uuid
          x-classification: internal
        version:
          type: integer
          x-classification: internal
          readOnly: true
        audit:
          $ref: ../root.yaml#/components/schemas/AuditStamp
          x-classification: internal
          readOnly: true
      required:
      - id
      - code
      - name
      - definition
    SavedReportInput:
      type: object
      description: Create/replace body of SavedReport
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          x-classification: internal
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-classification: internal
        definition:
          type: object
          additionalProperties: true
          x-classification: internal
        schedule:
          type:
          - string
          - 'null'
          maxLength: 255
          x-classification: internal
        recipients:
          type: array
          items:
            type: string
            format: uuid
          x-classification: internal
      required:
      - code
      - name
      - definition
